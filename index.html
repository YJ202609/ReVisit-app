<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="再訪問リスト">
<title>再訪問リスト</title>
<style>
:root{--bg:#f3f6ff;--card:#fff;--text:#182238;--muted:#6b7280;--line:#e7eaf3;--blue:#4f46e5;--blue2:#6366f1;--mint:#10b981;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ff,#f8fbff 45%,#f5f7fb);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 16px 8px}
h1{font-size:22px;margin:0;font-weight:800;white-space:nowrap}.search{width:100%;padding:12px 14px;border:1px solid #dfe4f2;border-radius:14px;font-size:16px;background:#fff}
.date-filter{position:relative;display:inline-flex;align-items:center}
.date-filter-toggle{display:inline-flex;align-items:center;gap:5px}
.date-filter-panel{display:none;position:absolute;top:46px;left:0;z-index:20;background:#fff;border:1px solid #dfe4f2;border-radius:14px;padding:12px;box-shadow:0 12px 30px #26315b22;min-width:290px}
.date-filter.open .date-filter-panel{display:block}
.date-filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.date-filter-panel input{padding:9px 10px;border:1px solid #dfe4f2;border-radius:10px;background:#fff;font:inherit;width:132px}
.date-filter-panel label{font-size:12px;color:#6b7280;font-weight:700}
.date-filter-actions{display:flex;gap:6px;margin-top:9px;justify-content:flex-end}
@media(max-width:520px){.date-filter-panel{position:fixed;left:16px;right:16px;top:90px;min-width:0}.date-filter-panel input{width:125px}}
.language-selector{position:absolute;right:16px;top:12px;z-index:10}
.lang-current{width:42px;height:42px;padding:0;border-radius:12px;border:1px solid #dfe4f2;background:#fff;color:#3730a3;font-weight:900;font-size:17px;box-shadow:0 3px 10px #26315b12}
.lang-menu{display:none;position:absolute;right:0;top:48px;background:#fff;border:1px solid #dfe4f2;border-radius:13px;padding:6px;box-shadow:0 12px 30px #26315b22;min-width:110px}
.language-selector.open .lang-menu{display:block}
.lang-option{display:block;width:100%;padding:9px 12px;border-radius:9px;background:#fff;color:#3730a3;text-align:left;font-weight:800}
.lang-option:hover{background:#eef2ff}
.lang-option.active{background:#4f46e5;color:#fff}
.title-row{display:flex;align-items:center;gap:9px;padding-right:52px}
.title-row .search{flex:1;min-width:0;width:auto;padding:7px 10px;border-radius:10px;font-size:14px}
@media(max-width:520px){.title-row{gap:7px}.title-row h1{font-size:20px}.title-row .search{max-width:145px}}
nav{display:flex;gap:7px;padding:0;overflow-x:auto;overflow-y:hidden;background:transparent;position:relative;z-index:1}
button,.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700;background:#e9edff;color:#3730a3;cursor:pointer;white-space:nowrap}button.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.sort-active{background:#4f46e5!important;color:#fff!important}.date-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}.date-filter input{padding:9px 10px;border:1px solid #dfe4f2;border-radius:10px;background:#fff;color:var(--text);font:inherit}.date-filter-label{font-size:12px;color:var(--muted);font-weight:700}
main{max-width:760px;margin:auto;padding:8px 16px 100px}.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#ec4899);color:#fff;border-radius:22px;padding:20px;margin:4px 0 14px;box-shadow:0 12px 30px #6366f133}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:13px}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
@media(max-width:700px){.dash{grid-template-columns:1fr 1fr}}.dashCard{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);padding:13px;border-radius:15px;box-shadow:0 4px 15px #26315b0a}.dashIcon{font-size:25px}.dashCard b{font-size:21px;display:block}.dashCard small{font-size:11px;color:var(--muted)}.nearby{background:linear-gradient(145deg,#fff,#ecfdf5)}.urgent{background:linear-gradient(145deg,#fff,#fff1f2)}.recent{background:linear-gradient(145deg,#fff,#fff7ed)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 5px 18px #26315b0b}.row{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:800}.muted{color:var(--muted);font-size:13px}.tag{display:inline-block;background:#eef2ff;color:#4338ca;padding:5px 8px;border-radius:999px;font-size:12px;margin:6px 4px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.danger{background:#fee2e2;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:45px 10px}.status{padding:10px 12px;border-radius:12px;background:#f8fafc;margin:10px 0;font-size:13px}
dialog{border:0;border-radius:20px;width:min(680px,94vw);padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}.form{padding:20px}.form h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:90px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}

/* Language selector: bottom data-management row only */
.actions{
  position:relative !important;
  display:flex !important;
  align-items:center !important;
  gap:12px !important;
  width:100% !important;
  box-sizing:border-box !important;
}
.actions > .language-selector{
  position:relative !important;
  top:auto !important;
  right:auto !important;
  bottom:auto !important;
  left:auto !important;
  margin-left:auto !important;
  margin-right:0 !important;
  align-self:center !important;
  flex:0 0 auto !important;
  display:flex !important;
  align-items:center !important;
  height:42px !important;
  z-index:100 !important;
}
.actions > .language-selector .lang-current{
  width:42px !important;
  height:42px !important;
  min-width:42px !important;
  min-height:42px !important;
  margin:0 !important;
  padding:0 !important;
  box-sizing:border-box !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}
.actions > .language-selector .lang-menu{
  position:absolute !important;
  top:auto !important;
  bottom:48px !important;
  right:0 !important;
  left:auto !important;
}

</style>

<body>
<header>
  <div class="header-content-block">
    <div class="title-row"><h1 data-i18n="title">再訪問リスト</h1><input id="search" class="search" data-placeholder="search" placeholder="名前・場所・メモを検索"></div>
    <nav>
<button class="primary" onclick="openForm()" data-i18n="new">＋ 新しい人</button>
<button onclick="setFilter('all')" data-i18n="all">すべて</button>
<button onclick="setFilter('today')" data-i18n="today">今日</button>
<button onclick="findNearby()" data-i18n="near">📍 現在地から近い順</button>
<button onclick="setFilter('urgent')" data-i18n="urgent">⚡ 緊急</button>
<button onclick="setFilter('recent')" data-i18n="recent">最近</button>
<button onclick="setSort('new')" id="sortNew" data-i18n="sortNew">↓ 新しい順</button>
<button onclick="setSort('old')" id="sortOld" data-i18n="sortOld">↑ 古い順</button>
<div class="date-filter" id="dateFilter">
<button type="button" class="date-filter-toggle" onclick="toggleDateFilter()">📅 <span id="dateFilterLabel">期間</span></button>
<div class="date-filter-panel">
<div class="date-filter-row"><label>開始日</label><input id="fromDate" type="date"><span>〜</span><label>終了日</label><input id="toDate" type="date"></div>
<div class="date-filter-actions"><button type="button" class="primary" onclick="applyDateRange()">適用</button><button type="button" onclick="clearDateRange()">解除</button></div>
</div></div>

</nav>
  </div>
  

</div>
</header>


<main>
<div class="dash">
<button class="dashCard today" onclick="setFilter('today')"><span class="dashIcon">📅</span><span><b id="todayCount">0</b><small data-i18n="todayPeople">今日訪問する人</small></span></button>
<button class="dashCard overdue" onclick="setFilter('overdue')"><span class="dashIcon">⏰</span><span><b id="overdueCount">0</b><small data-i18n="overduePeople">予定日を過ぎた人</small></span></button>
<button class="dashCard nearby" onclick="findNearby()"><span class="dashIcon">📍</span><span><b id="nearbyCount">0</b><small data-i18n="nearPeople">現在地から近い人</small></span></button>
<button class="dashCard urgent" onclick="setFilter('urgent')"><span class="dashIcon">⚡</span><span><b id="urgentCount">0</b><small data-i18n="urgentPeople">緊急訪問できる人</small></span></button>
<button class="dashCard recent" onclick="setFilter('recent')"><span class="dashIcon">🕘</span><span><b id="recentCount">0</b><small data-i18n="recentPeople">最近会った人</small></span></button>
</div>
<div id="nearStatus"></div>
<div class="stats" id="stats"></div><section id="list"></section>
<section class="card">
<div class="actions">
<button type="button" onclick="exportData()" data-i18n="backup">⬇️ バックアップ</button>
<label class="btn"><span data-i18n="restore">⬆️ 復元</span><input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="importData(event)"></label>
<div class="language-selector" id="languageSelector">
<button type="button" class="lang-current" id="langCurrent" aria-label="Language" onclick="toggleLangMenu()">J</button>
<div class="lang-menu">
<button type="button" class="lang-option" data-lang="ja" onclick="setLang('ja')">J　日本語</button>
<button type="button" class="lang-option" data-lang="en" onclick="setLang('en')">E　English</button>
<button type="button" class="lang-option" data-lang="zh" onclick="setLang('zh')">中　中文</button>
</div>

</div>

</section>
</main>

<dialog id="dlg"><form class="form" onsubmit="savePerson(event)">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
<h2 id="dlgTitle" style="margin-bottom:0">新しい人</h2>
<button type="button" onclick="dlg.close()" data-i18n="cancel">キャンセル</button>
</div><input type="hidden" id="id">
<div class="field wide" style="border:1px solid var(--border,#ddd);padding:12px;border-radius:12px">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
    <button type="button" onclick="focusVoiceInput()" data-i18n="voiceInput">🎙️ 音声入力</button>
    <button type="button" onclick="organizeVoiceIntoForm()" data-i18n="voiceOrganize">✨ 内容を自動整理</button>
  </div>
  <div class="muted" style="margin-bottom:8px" data-i18n="voicePrompt">下の入力欄をタップして、iPhoneキーボードの🎤で話してください。その後「内容を自動整理」を押します。</div>
  <textarea id="voiceInput" rows="3" placeholder="例：ジョンさんです。場所はミリ。聖書に興味があります。来週もう一度訪問します。"></textarea>
  <div id="voiceOrganizeStatus" class="muted" style="margin-top:6px"></div>
</div>
<div class="grid">
<div class="field"><label data-i18n="name">名前</label><input id="name" required></div><div class="field"><label data-i18n="visitDate">訪問日</label><input id="date" type="date"></div>
<div class="field"><label data-i18n="place">場所</label><input id="place"></div><div class="field"><label data-i18n="mapLink">地図リンク</label><input id="map" placeholder="Google Maps"></div>
<div class="field"><label data-i18n="lat">緯度</label><input id="lat" type="number" step="any"></div><div class="field"><label data-i18n="lon">経度</label><input id="lon" type="number" step="any"></div>
<div class="field wide"><button type="button" onclick="useCurrentLocation()">📍 <span data-i18n="saveCurrent">現在地を取得して地図リンクも登録</span></button></div>
<div class="field"><label data-i18n="interest">宗教・関心など</label><input id="interest"></div><div class="field"><label data-i18n="nextDate">次回訪問</label><input id="next" type="date"></div>
<div class="field wide"><label data-i18n="notes">メモ</label><textarea id="notes"></textarea></div><div class="field wide"><label data-i18n="tags">タグ（カンマ区切り）</label><input id="tags"></div>
<div class="field wide"><label><input id="urgent" type="checkbox" style="width:auto"> <span data-i18n="urgentFlag">緊急訪問候補にする</span></label></div>
</div><div class="modal-actions"><button type="button" onclick="dlg.close()" data-i18n="cancel">キャンセル</button><button class="primary" data-i18n="save">保存</button></div>
</form></dialog>

function dateFromText(text, baseDate=new Date()){
  const now=new Date(baseDate);
  const clean=String(text||'').replace(/\s+/g,' ').trim().toLowerCase();
  if(/今日|本日|today/.test(clean)) return now.toISOString().slice(0,10);
  if(/明後日|day after tomorrow/.test(clean)){const d=new Date(now);d.setDate(d.getDate()+2);return d.toISOString().slice(0,10)}
  if(/明日|tomorrow/.test(clean)){const d=new Date(now);d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
  if(/明々後日|しあさって/.test(clean)){const d=new Date(now);d.setDate(d.getDate()+3);return d.toISOString().slice(0,10)}
  let m=clean.match(/(20\d{2})[年\/-](\d{1,2})[月\/-](\d{1,2})日?/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=clean.match(/(\d{1,2})月(\d{1,2})日/);
  if(m)return `${now.getFullYear()}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  // 来週、来週の土曜日、next week などは「次回訪問」の日付として扱う
  if(/来週|next week/.test(clean)){
    const d=new Date(now); d.setDate(d.getDate()+7);
    const weekday=clean.match(/(?:来週|next week).*?(月|火|水|木|金|土|日)曜?/);
    if(weekday){const map={月:1,火:2,水:3,木:4,金:5,土:6,日:0};const target=map[weekday[1]];const diff=(target-d.getDay()+7)%7;d.setDate(d.getDate()+diff+(diff===0?7:0));}
    return d.toISOString().slice(0,10);
  }
  if(/\d+\s*(日後|days? later)/.test(clean)){
    const n=Number((clean.match(/\d+/)||['0'])[0]);const d=new Date(now);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);
  }
  return '';
}
function sentenceParts(text){
  return String(text||'').replace(/[。！？!?]+/g,'。').split(/[。\n]+/).map(s=>s.trim()).filter(Boolean);
}
function cleanPersonName(s){
  return String(s||'').replace(/^(?:名前(?:は|が)?|name\s*(?:is)?|姓名[是为]?)\s*/i,'').replace(/[「」『』]/g,'').replace(/(?:さん|様|先生)$/,'').trim();
}
function extractName(t, parts){
  let m=t.match(/(?:名前(?:は|が)?|name\s*(?:is)?|姓名[是为]?)\s*[：:]?\s*([^、。,\.。;；\n]+)/i);
  if(m)return cleanPersonName(m[1]);
  for(const p of parts){
    m=p.match(/^\s*([^、。,\.。;；\n]+?)(?:さん|様|先生)(?:は|が|と|、|，|,|$)/);
    if(m)return cleanPersonName(m[1]);
    m=p.match(/^\s*([^、。,\.。;；\n]+?)(?:さん|様|先生)\s*$/);
    if(m)return cleanPersonName(m[1]);
  }
  return '';
}
function extractPlace(t, parts){
  let m=t.match(/(?:場所|会った場所|地点|place|location)\s*(?:は|が|在|is)?\s*[：:]?\s*([^、。,\.。;；\n]+)/i);
  if(m)return m[1].trim().replace(/(?:です|でした|那里|那里。)$/,'').trim();
  for(const p of parts){
    m=p.match(/(?:^|\s)([^、。,\.。;；\n]+?)\s*(?:で|にて)\s*(?:会い|会った|会いました|話し|話しました|出会い|出会いました|遇到|见面)/i);
    if(m && !/今日|明日|昨日|来週|next|today|tomorrow/i.test(m[1])) return m[1].trim();
    m=p.match(/(?:at|in)\s+([^,.!?]+?)(?:\s+(?:and|where|we)|$)/i);
    if(m)return m[1].trim();
  }
  return '';
}
function extractInterest(t, parts){
  const hits=[];
  for(const p of parts){
    if(/興味|関心|興味がある|興味を持|関心を持|好き|気に入|interested in|interest|likes?|对.*感兴趣|兴趣|喜欢/.test(p)) hits.push(p.trim());
  }
  return hits.join('。');
}
function extractNext(t, parts){
  for(const p of parts){
    if(/次回|次に|また|再訪|来週|明日|明後日|next visit|next time|visit again|下次|再去|下周|明天|后天/i.test(p)){
      const d=dateFromText(p);
      if(d)return d;
    }
  }
  return '';
}
function parseVoice(text){
  const t=String(text||'').replace(/\s+/g,' ').trim();
  const parts=sentenceParts(t);
  const name=extractName(t,parts);
  const place=extractPlace(t,parts);
  const interest=extractInterest(t,parts);
  const next=extractNext(t,parts);
  const date=dateFromText(t);
  const urgent=/緊急|急ぎ|早め|urgent|as soon as possible|紧急|尽快/i.test(t);
  let remaining=parts.filter(p=>{
    if(name && (p.includes(name)||new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:さん|様|先生)').test(p))) return false;
    if(place && (p.includes(place+'で')||p.includes(place+'にて')||p.includes('場所')||/^(?:at|in)\s/i.test(p))) return false;
    if(interest && interest.includes(p)) return false;
    if(/次回|次に|また|再訪|来週|明日|明後日|next visit|next time|visit again|下次|再去|下周/i.test(p) && dateFromText(p)) return false;
    if(date && /今日|本日|today|明日|明後日|20\d{2}[年\/-]|\d{1,2}月\d{1,2}日/.test(p)) return false;

}

function openForm(p=null){
  $("dlgTitle").textContent=p?tr("edit"):tr("new");
  $("id").value=p?.id||"";$("name").value=p?.name||"";$("date").value=p?.date||"";$("place").value=p?.place||"";$("map").value=p?.map||makeMap(p?.place||"");
  $("lat").value=Number.isFinite(p?.lat)?p.lat:"";$("lon").value=Number.isFinite(p?.lon)?p.lon:"";$("interest").value=p?.interest||"";$("next").value=p?.next||"";$("notes").value=p?.notes||"";$("tags").value=(p?.tags||[]).join(", ");$("urgent").checked=!!p?.urgent;
  $("voiceInput").value="";
  const status=document.getElementById("voiceOrganizeStatus"); if(status) status.textContent="";
  dlg.showModal();
}
function edit(id){openForm(people.find(p=>p.id===id))}
function savePerson(e){e.preventDefault();let id=$("id").value||crypto.randomUUID(),p={id,name:$("name").value.trim(),date:$("date").value,place:$("place").value.trim(),map:$("map").value.trim()||makeMap($("place").value.trim()),lat:$("lat").value?Number($("lat").value):null,lon:$("lon").value?Number($("lon").value):null,interest:$("interest").value.trim(),next:$("next").value,notes:$("notes").value.trim(),tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),urgent:$("urgent").checked};let old=people.some(x=>x.id===id);people=old?people.map(x=>x.id===id?p:x):[...people,p];save();dlg.close();render()}
function useCurrentLocation(){
if(!navigator.geolocation)return alert(tr("locationFail"));
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6);
$("lat").value=lat;$("lon").value=lon;
$("map").value="https://www.google.com/maps/search/?api=1&query="+lat+","+lon;
if(!$("place").value.trim())$("place").value=lat+", "+lon;
alert(tr("saved"))
},()=>alert(tr("locationFail")),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})
}
function removePerson(id){if(confirm(tr("delete")+"?")){people=people.filter(x=>x.id!==id);save();render()}}
function duplicate(id){let p=structuredClone(people.find(x=>x.id===id));p.id=crypto.randomUUID();people.push(p);save();render()}
function exportData(){let payload={version:1,app:"再訪問リスト",exportedAt:new Date().toISOString(),people};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));a.download="再訪問リスト_バックアップ_"+new Date().toISOString().slice(0,10)+".json";a.click()}
function importData(e){
 const input=e.target;
 const f=input.files&&input.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const raw=String(r.result||"").replace(/^\uFEFF/,'').trim();
   if(!raw)throw new Error("empty");
   const x=JSON.parse(raw);
   const arr=Array.isArray(x)?x:(x&&Array.isArray(x.people)?x.people:null);
   if(!arr)throw new Error("invalid");
   const imported=arr.map(normalize).filter(p=>p.name||p.place||p.notes||p.date);
   if(!imported.length&&arr.length)throw new Error("no-valid-records");
   people=imported;
   save(); filter="all"; nearMode=false; render();
   alert(`${imported.length}件を復元しました。\n（読み込み元：${arr.length}件）`);
  }catch(err){
   console.error("Import failed:",err);
   alert("JSONファイルを読み込めませんでした。\n正しい「再訪問リスト」バックアップファイルを選択してください。");
  }finally{input.value="";}
 };
 r.onerror=()=>{input.value="";alert("ファイルの読み込みに失敗しました。");};
 r.readAsText(f,"utf-8");
}
applyLang();render();
</script>
<script>
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v=34").catch(()=>{}));
</script>
</body></html>
