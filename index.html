<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="再訪問リスト">
<title>再訪問リスト</title>
<style>
:root{--bg:#f3f6ff;--card:#fff;--text:#182238;--muted:#6b7280;--line:#e7eaf3;--blue:#4f46e5;--blue2:#6366f1;--mint:#10b981;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ff,#f8fbff 45%,#f5f7fb);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{font-size:22px;margin:0 0 10px;font-weight:800}.search{width:100%;padding:12px 14px;border:1px solid #dfe4f2;border-radius:14px;font-size:16px;background:#fff}
nav{display:flex;gap:7px;padding:10px 16px;overflow:auto;background:transparent;position:sticky;top:132px;z-index:4}
button,.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:700;background:#e9edff;color:#3730a3;cursor:pointer;white-space:nowrap}button.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.sort-active{background:#4f46e5!important;color:#fff!important}.language-bar{display:flex;gap:6px;margin-top:10px}.lang-btn{flex:1;padding:9px 8px;border-radius:10px;border:1px solid #dfe4f2;background:#fff;color:#3730a3;font-weight:800}.lang-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}.lang-btn:active{transform:scale(.98)}
main{max-width:760px;margin:auto;padding:8px 16px 100px}.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#ec4899);color:#fff;border-radius:22px;padding:20px;margin:4px 0 14px;box-shadow:0 12px 30px #6366f133}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:13px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.dashCard{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);padding:13px;border-radius:15px;box-shadow:0 4px 15px #26315b0a}.dashIcon{font-size:25px}.dashCard b{font-size:21px;display:block}.dashCard small{font-size:11px;color:var(--muted)}.nearby{background:linear-gradient(145deg,#fff,#ecfdf5)}.urgent{background:linear-gradient(145deg,#fff,#fff1f2)}.recent{background:linear-gradient(145deg,#fff,#fff7ed)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 5px 18px #26315b0b}.row{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:800}.muted{color:var(--muted);font-size:13px}.tag{display:inline-block;background:#eef2ff;color:#4338ca;padding:5px 8px;border-radius:999px;font-size:12px;margin:6px 4px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.danger{background:#fee2e2;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:45px 10px}.status{padding:10px 12px;border-radius:12px;background:#f8fafc;margin:10px 0;font-size:13px}
dialog{border:0;border-radius:20px;width:min(680px,94vw);padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}.form{padding:20px}.form h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:90px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<header><h1 data-i18n="title">再訪問リスト</h1><input id="search" class="search" data-placeholder="search" placeholder="名前・場所・メモを検索">
<div class="language-bar" aria-label="Language"><button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日本語</button><button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">English</button><button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button></div></header>
<nav>
<button class="primary" onclick="openForm()" data-i18n="new">＋ 新しい人</button>
<button onclick="setFilter('all')" data-i18n="all">すべて</button>
<button onclick="setFilter('today')" data-i18n="today">今日</button>
<button onclick="findNearby()" data-i18n="near">📍 現在地から近い順</button>
<button onclick="setFilter('urgent')" data-i18n="urgent">⚡ 緊急</button>
<button onclick="setFilter('recent')" data-i18n="recent">最近</button>
<button onclick="setSort('new')" id="sortNew" data-i18n="sortNew">↓ 新しい順</button>
<button onclick="setSort('old')" id="sortOld" data-i18n="sortOld">↑ 古い順</button>
<button onclick="exportData()" data-i18n="backup">バックアップ</button>
<label class="btn" style="cursor:pointer" data-i18n="restore">復元<input id="file" type="file" accept=".json,application/json" hidden onchange="importData(event)"></label>

</nav>
<main>
<div class="hero"><h2 data-i18n="heroTitle">今日の再訪問をチェック 👋</h2><p data-i18n="heroText">会った人・話したこと・次に訪問したい人を、ここにまとめておけます。</p></div>
<div class="dash">
<button class="dashCard" onclick="setFilter('today')"><span class="dashIcon">📅</span><span><b id="todayCount">0</b><small data-i18n="todayPeople">今日訪問する人</small></span></button>
<button class="dashCard nearby" onclick="findNearby()"><span class="dashIcon">📍</span><span><b id="nearbyCount">0</b><small data-i18n="nearPeople">現在地から近い人</small></span></button>
<button class="dashCard urgent" onclick="setFilter('urgent')"><span class="dashIcon">⚡</span><span><b id="urgentCount">0</b><small data-i18n="urgentPeople">緊急訪問できる人</small></span></button>
<button class="dashCard recent" onclick="setFilter('recent')"><span class="dashIcon">🕘</span><span><b id="recentCount">0</b><small data-i18n="recentPeople">最近会った人</small></span></button>
</div>
<div id="nearStatus"></div>
<div class="stats" id="stats"></div><section id="list"></section>
<section class="card">
<h2 data-i18n="dataTitle">💾 データ管理</h2><p class="muted" data-i18n="dataText">この端末のデータをバックアップ・復元します。個人データはGitHubにアップロードしないでください。</p>
<div class="actions"><button onclick="exportData()" data-i18n="backup">⬇️ バックアップ</button><label class="btn" data-i18n="restore">⬆️ 復元<input type="file" accept=".json,application/json" hidden onchange="importData(event)"></label></div>
</section>
</main>

<dialog id="dlg"><form class="form" onsubmit="savePerson(event)">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
<h2 id="dlgTitle" style="margin-bottom:0">新しい人</h2>
<button type="button" onclick="dlg.close()" data-i18n="cancel">キャンセル</button>
</div><input type="hidden" id="id"><div class="grid">
<div class="field"><label data-i18n="name">名前</label><input id="name" required></div><div class="field"><label data-i18n="visitDate">訪問日</label><input id="date" type="date"></div>
<div class="field"><label data-i18n="place">場所</label><input id="place"></div><div class="field"><label data-i18n="mapLink">地図リンク</label><input id="map" placeholder="Google Maps"></div>
<div class="field"><label data-i18n="lat">緯度</label><input id="lat" type="number" step="any"></div><div class="field"><label data-i18n="lon">経度</label><input id="lon" type="number" step="any"></div>
<div class="field wide"><button type="button" onclick="useCurrentLocation()">📍 <span data-i18n="saveCurrent">現在地を取得して地図リンクも登録</span></button></div>
<div class="field"><label data-i18n="interest">宗教・関心など</label><input id="interest"></div><div class="field"><label data-i18n="nextDate">次回訪問</label><input id="next" type="date"></div>
<div class="field wide"><label data-i18n="notes">メモ</label><textarea id="notes"></textarea></div><div class="field wide"><label data-i18n="tags">タグ（カンマ区切り）</label><input id="tags"></div>
<div class="field wide"><label><input id="urgent" type="checkbox" style="width:auto"> <span data-i18n="urgentFlag">緊急訪問候補にする</span></label></div>
</div><div class="modal-actions"><button type="button" onclick="dlg.close()" data-i18n="cancel">キャンセル</button><button class="primary" data-i18n="save">保存</button></div>
</form></dialog>

<script>
const KEY="revisit-list-v1";
const I18N={
ja:{title:"再訪問リスト",new:"＋ 新しい人",all:"すべて",today:"今日",near:"📍 現在地から近い順",sortNew:"↓ 新しい順",sortOld:"↑ 古い順",urgent:"⚡ 緊急",recent:"最近",backup:"⬇️ バックアップ",restore:"⬆️ 復元",search:"名前・場所・メモを検索",heroTitle:"今日の再訪問をチェック 👋",heroText:"会った人・話したこと・次に訪問したい人を、ここにまとめておけます。",todayPeople:"今日訪問する人",nearPeople:"現在地から近い人",urgentPeople:"緊急訪問できる人",recentPeople:"最近会った人",dataTitle:"💾 データ管理",dataText:"この端末のデータをバックアップ・復元します。個人データはGitHubにアップロードしないでください。",name:"名前",visitDate:"訪問日",place:"場所",mapLink:"地図リンク",lat:"緯度",lon:"経度",saveCurrent:"現在地を取得して地図リンクも登録",interest:"宗教・関心など",nextDate:"次回訪問",notes:"メモ",tags:"タグ（カンマ区切り）",urgentFlag:"緊急訪問候補にする",cancel:"キャンセル",save:"保存",registered:"登録人数",todayRevisit:"今日の再訪問",nextTalk:"次回話す",noPeople:"該当する人はいません。",locationFail:"位置情報を取得できませんでした。iPhoneの位置情報許可を確認してください。",noCoords:"住所から位置情報を取得できた人がまだいません。もう一度実行すると続きから試します。",geocoding:"住所から位置情報を調べています…",geocoded:"件の住所の位置情報を取得しました。",nearDone:"近い順に表示しました。",gettingLocation:"現在地を取得しています…",locationFound:"現在地を取得しました",nearReady:"近い人を表示できます。",remaining:"件の住所はまだ位置情報を取得できません。",maps:"地図",edit:"編集",copy:"複製",delete:"削除",distance:"距離",noLoc:"場所未登録",saved:"現在地を登録しました。保存してください。",restored:"件を復元しました。"} ,
en:{title:"Revisit List",new:"+ New Person",all:"All",today:"Today",near:"📍 Nearest First",sortNew:"↓ Newest first",sortOld:"↑ Oldest first",urgent:"⚡ Urgent",recent:"Recent",backup:"⬇️ Backup",restore:"⬆️ Restore",search:"Search name, place or notes",heroTitle:"Check today's revisits 👋",heroText:"Keep people, conversations and next visits in one place.",todayPeople:"Today's visits",nearPeople:"Nearest to me",urgentPeople:"Urgent visits",recentPeople:"Recently visited",dataTitle:"💾 Data",dataText:"Backup and restore data on this device. Do not upload personal data to GitHub.",name:"Name",visitDate:"Visit date",place:"Place",mapLink:"Map link",lat:"Latitude",lon:"Longitude",saveCurrent:"Save current location for this person",interest:"Interest / background",nextDate:"Next visit",notes:"Notes",tags:"Tags (comma separated)",urgentFlag:"Mark as urgent",cancel:"Cancel",save:"Save",registered:"People",todayRevisit:"Today's revisits",nextTalk:"Next talk",noPeople:"No matching people.",locationFail:"Could not get your location. Check iPhone location permission.",noCoords:"No saved coordinates yet. Run this again to continue.",geocoding:"Looking up locations from addresses…",geocoded:" locations were found.",nearDone:"Sorted by distance.",gettingLocation:"Getting your location…",locationFound:"Your location was found",nearReady:"Nearby people can now be shown.",remaining:" addresses still need location data.",maps:"Map",edit:"Edit",copy:"Copy",delete:"Delete",distance:"Distance",noLoc:"No location",saved:"Location added. Please save.",restored:" people restored."},
zh:{title:"再访名单",new:"＋ 新增联系人",all:"全部",today:"今天",near:"📍 按距离排序",sortNew:"↓ 最新在前",sortOld:"↑ 最旧在前",urgent:"⚡ 紧急",recent:"最近",backup:"⬇️ 备份",restore:"⬆️ 恢复",search:"搜索姓名、地点或备注",heroTitle:"查看今天的再访 👋",heroText:"把见过的人、谈过的内容和下次访问集中记录。",todayPeople:"今天访问",nearPeople:"离当前位置最近",urgentPeople:"紧急访问",recentPeople:"最近访问",dataTitle:"💾 数据管理",dataText:"在本设备备份和恢复数据。不要把个人数据上传到GitHub。",name:"姓名",visitDate:"访问日期",place:"地点",mapLink:"地图链接",lat:"纬度",lon:"经度",saveCurrent:"将当前位置保存给此联系人",interest:"兴趣 / 背景",nextDate:"下次访问",notes:"备注",tags:"标签（逗号分隔）",urgentFlag:"标记为紧急",cancel:"取消",save:"保存",registered:"联系人",todayRevisit:"今天再访",nextTalk:"下次谈",noPeople:"没有符合条件的人。",locationFail:"无法获取当前位置，请检查iPhone定位权限。",noCoords:"还没有保存坐标。再次运行可继续尝试。",geocoding:"正在根据地址查找位置…",geocoded:" 个地址已找到位置。",nearDone:"已按距离排序。",gettingLocation:"正在获取当前位置…",locationFound:"已获取当前位置",nearReady:"现在可以显示附近联系人。",remaining:" 个地址还没有位置信息。",maps:"地图",edit:"编辑",copy:"复制",delete:"删除",distance:"距离",noLoc:"没有地点",saved:"当前位置已添加，请保存。",restored:" 个联系人已恢复。"}};
function lang(){return localStorage.getItem("revisit-lang")||"ja"} function tr(k){return (I18N[lang()]||I18N.ja)[k]||k}
function setLang(v){localStorage.setItem("revisit-lang",v);applyLang();render(); if(window.nearMode) renderNearbyDistance()}
function applyLang(){document.documentElement.lang=lang();document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll("[data-placeholder]").forEach(e=>e.placeholder=tr(e.dataset.placeholder));document.querySelectorAll(".lang-btn").forEach(e=>e.classList.toggle("active",e.dataset.lang===lang()));$("sortNew")?.classList.toggle("sort-active",sortMode==="new");$("sortOld")?.classList.toggle("sort-active",sortMode==="old")}
const $=id=>document.getElementById(id);
let people=loadPeople(), filter="all", sortMode=localStorage.getItem("revisit-sort")||"new", userLat=null,userLon=null,nearMode=false;
function normalize(p,i){return{id:p.id||"import-"+Date.now()+"-"+i,name:p.name||"",date:p.date||p.visitDate||"",place:p.place||"",map:p.map||p.mapLink||makeMap(p.place||""),lat:p.lat!=null?Number(p.lat):(p.latitude!=null?Number(p.latitude):null),lon:p.lon!=null?Number(p.lon):(p.longitude!=null?Number(p.longitude):null),interest:p.interest||"",next:p.next||p.nextVisitDate||"",notes:p.notes||"",tags:Array.isArray(p.tags)?p.tags:[],urgent:!!p.urgent}}
function makeMap(place){return place?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(place):""}
function loadPeople(){try{let x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x.map(normalize):[]}catch{return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(people))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setFilter(f){filter=f;nearMode=false;render()}
$("search").addEventListener("input",()=>nearMode?renderNearbyDistance():render());
function setSort(v){sortMode=v;localStorage.setItem("revisit-sort",v);nearMode=false;render()}
function render(){
let q=$("search").value.trim().toLowerCase(),now=new Date().toISOString().slice(0,10),cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
let arr=people.filter(p=>{if(filter==="today"&&p.next!==now)return false;if(filter==="recent"&&(!p.date||new Date(p.date)<cutoff))return false;if(filter==="urgent"&&!p.urgent)return false;return !q||[p.name,p.place,p.interest,p.notes,(p.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)}).sort((a,b)=>sortMode==="old"?(a.date||"").localeCompare(b.date||""):(b.date||"").localeCompare(a.date||""));
$("todayCount").textContent=people.filter(p=>p.next===now).length;$("nearbyCount").textContent=people.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)).length;$("urgentCount").textContent=people.filter(p=>p.urgent).length;$("recentCount").textContent=people.filter(p=>p.date&&new Date(p.date)>=cutoff).length;
$("stats").innerHTML=`<div class="stat"><b>${people.length}</b><span>${tr("registered")}</span></div><div class="stat"><b>${people.filter(p=>p.next===now).length}</b><span>${tr("todayRevisit")}</span></div><div class="stat"><b>${people.filter(p=>p.tags?.includes("次回話す")).length}</b><span>${tr("nextTalk")}</span></div>`;
$("list").innerHTML=arr.length?arr.map(card).join(""):`<div class="empty">${tr("noPeople")}</div>`;$("nearStatus").innerHTML="";
}
function distanceKm(a,b,c,d){const R=6371,rad=Math.PI/180,dl=(c-a)*rad,do_=(d-b)*rad,x=Math.sin(dl/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(do_/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
async function findNearby(){
nearMode=true;
if(!navigator.geolocation){$("nearStatus").innerHTML=`<div class="status">${tr("locationFail")}</div>`;return}
$("nearStatus").innerHTML=`<div class="status">📍 ${tr("gettingLocation")}</div>`;
navigator.geolocation.getCurrentPosition(async pos=>{
 userLat=pos.coords.latitude; userLon=pos.coords.longitude;
 $("nearStatus").innerHTML=`<div class="status">📍 ${tr("locationFound")} (${userLat.toFixed(4)}, ${userLon.toFixed(4)})<br>${tr("geocoding")}</div>`;
 await geocodeMissing(20);
 renderNearbyDistance();
},()=>{$("nearStatus").innerHTML=`<div class="status">${tr("locationFail")}</div>`},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
async function geocodeMissing(limit=20){
let missing=people.filter(p=>p.place&&(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))).slice(0,limit);
let found=0;
for(let i=0;i<missing.length;i++){
 let p=missing[i],q=p.place;
 if(!/[Mm]iri|Lutong|Sarawak|Malaysia/i.test(q))q+=", Miri, Sarawak, Malaysia";
 try{
  let url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(q);
  let r=await fetch(url,{headers:{Accept:"application/json"}}); let j=await r.json();
  if(j[0]){p.lat=Number(j[0].lat);p.lon=Number(j[0].lon);found++;}
 }catch(e){}
 $("nearStatus").innerHTML=`<div class="status">${tr("geocoding")} ${i+1}/${missing.length} — ${tr("geocoded")} ${found}</div>`;
 await new Promise(r=>setTimeout(r,1100));
}
if(found)save();
let remaining=people.filter(p=>p.place&&(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))).length;
$("nearStatus").innerHTML=`<div class="status">${found}${tr("geocoded")} ${remaining?"｜"+remaining+tr("remaining"):tr("nearReady")}</div>`;
$("nearbyCount").textContent=people.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)).length;
}
function renderNearbyDistance(){
let q=$("search").value.trim().toLowerCase();
let arr=people.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)).map(p=>({...p,_dist:distanceKm(userLat,userLon,p.lat,p.lon)})).filter(p=>!q||[p.name,p.place,p.notes,p.interest].join(" ").toLowerCase().includes(q)).sort((a,b)=>a._dist-b._dist);
$("list").innerHTML=arr.length?arr.map(card).join(""):`<div class="empty">${tr("noCoords")}</div>`;
}
function card(p){
let tags=(p.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
let d=p._dist!=null?` · 📍 ${p._dist<1?Math.round(p._dist*1000)+"m":p._dist.toFixed(1)+"km"}`:"";
let map=p.map||makeMap(p.place);
return `<article class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.place||tr("noLoc"))}${p.date?" · "+esc(p.date):""}${d}</div></div></div>${p.urgent?`<span class="tag">⚡</span>`:""}${p.interest?`<div class="muted" style="margin-top:8px">${esc(p.interest)}</div>`:""}${p.notes?`<div style="margin-top:8px;white-space:pre-wrap">${esc(p.notes)}</div>`:""}<div>${tags}</div>${p.next?`<div class="muted" style="margin-top:8px">${esc(p.next)}</div>`:""}<div class="actions">${map?`<button onclick="window.open('${esc(map)}','_blank')">${tr("maps")}</button>`:""}<button onclick="edit('${esc(p.id)}')">${tr("edit")}</button><button onclick="duplicate('${esc(p.id)}')">${tr("copy")}</button><button class="danger" onclick="removePerson('${esc(p.id)}')">${tr("delete")}</button></div></article>`
}
function openForm(p=null){$("dlgTitle").textContent=p?tr("edit"):tr("new");$("id").value=p?.id||"";$("name").value=p?.name||"";$("date").value=p?.date||"";$("place").value=p?.place||"";$("map").value=p?.map||makeMap(p?.place||"");$("lat").value=Number.isFinite(p?.lat)?p.lat:"";$("lon").value=Number.isFinite(p?.lon)?p.lon:"";$("interest").value=p?.interest||"";$("next").value=p?.next||"";$("notes").value=p?.notes||"";$("tags").value=(p?.tags||[]).join(", ");$("urgent").checked=!!p?.urgent;dlg.showModal()}
function edit(id){openForm(people.find(p=>p.id===id))}
function savePerson(e){e.preventDefault();let id=$("id").value||crypto.randomUUID(),p={id,name:$("name").value.trim(),date:$("date").value,place:$("place").value.trim(),map:$("map").value.trim()||makeMap($("place").value.trim()),lat:$("lat").value?Number($("lat").value):null,lon:$("lon").value?Number($("lon").value):null,interest:$("interest").value.trim(),next:$("next").value,notes:$("notes").value.trim(),tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),urgent:$("urgent").checked};let old=people.some(x=>x.id===id);people=old?people.map(x=>x.id===id?p:x):[...people,p];save();dlg.close();render()}
function useCurrentLocation(){
if(!navigator.geolocation)return alert(tr("locationFail"));
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6);
$("lat").value=lat;$("lon").value=lon;
$("map").value="https://www.google.com/maps/search/?api=1&query="+lat+","+lon;
if(!$("place").value.trim())$("place").value=lat+", "+lon;
alert(tr("saved"))
},()=>alert(tr("locationFail")),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})
}
function removePerson(id){if(confirm(tr("delete")+"?")){people=people.filter(x=>x.id!==id);save();render()}}
function duplicate(id){let p=structuredClone(people.find(x=>x.id===id));p.id=crypto.randomUUID();people.push(p);save();render()}
function exportData(){let payload={version:1,app:"再訪問リスト",exportedAt:new Date().toISOString(),people};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));a.download="再訪問リスト_バックアップ_"+new Date().toISOString().slice(0,10)+".json";a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),arr=Array.isArray(x)?x:x.people;if(!Array.isArray(arr))throw 0;people=arr.map(normalize);save();render();alert(people.length+tr("restored"))}catch{alert("JSON error")}};r.readAsText(f,"utf-8");e.target.value=""}
applyLang();render();
</script>
<script>
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v=5").catch(()=>{}));
</script>
</body></html>
